<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>行程速查</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7C5CF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="行程速查">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --violet:#7C5CF0; --violet-deep:#4B2FB8; --violet-tint:#EFEBFF; --violet-hl:#F3F0FF; --violet-line:#DDD4FF;
  --mint:#2DD4BF; --mint-deep:#0E7C6F; --mint-tint:#E4F8F4;
  --ground:#F8F7FF; --card:#FFFFFF;
  --ink:#1C1930; --ink2:#6B6585; --ink3:#9A94B0; --line:#EAE7F5;
  --danger:#B02A2A; --danger-tint:#FBE9E9;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,[data-lp],.card,.vrow,.trow,.erow,.arow,.pitem,.srow,.nrow,.tcard,.dtab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--ground); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--violet-deep)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.noscroll{scrollbar-width:none;-ms-overflow-style:none}
.noscroll::-webkit-scrollbar{width:0;height:0;display:none}

#app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;background:var(--ground);position:relative;overflow:hidden}
#navbar{flex:0 0 auto;background:var(--card);padding-top:var(--safeT)}
#navbar .in{display:flex;align-items:center;gap:2px;padding:4px 8px 0;min-height:42px}
#navbar .back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--violet-deep);flex:0 0 auto}
#navbar .ttl{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--violet-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(28px + var(--safeB))}

/* ── 我的旅程 ── */
.tlist{padding:4px 16px 0}
.tlist h1{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:6px 2px 4px}
.tlist .sub{font-size:12.5px;color:var(--ink2);margin:0 2px 14px}
.tcardwrap{position:relative;margin-bottom:10px}
.tcard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.tcard.on{border-color:var(--violet)}
.tcardwrap:has(.pop){z-index:5}
.pwrap{position:relative}
.tthumb{position:relative;flex:0 0 66px;width:66px;height:66px;border-radius:13px;background:var(--violet-hl);border:1px solid var(--violet-line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--violet-deep)}
.tthumb img{width:100%;height:100%;object-fit:cover;display:block}
.tthumb .stk{position:absolute;font-size:17px;line-height:1;filter:drop-shadow(0 1px 2px rgba(28,25,48,.3));transform:translate(-50%,-50%)}
.tmeta{flex:1;min-width:0}
.tmeta .t{display:block;font-size:16.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta .d{display:block;font-size:12.5px;color:var(--ink2);margin-top:4px}
.tmeta .w{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgo{flex:0 0 auto;color:var(--ink3)}

/* ── 总览 ── */
.ovwrap{background:var(--card);padding:2px 12px 12px}
.ov{position:relative;padding:12px 13px;background:var(--ground);border:1px solid #EFECFA;border-radius:16px}
.ov-r1{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ov-who{font-size:12px;color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-season{flex:0 0 auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--mint-tint);color:var(--mint-deep)}
.ov-r2{display:flex;align-items:flex-end;gap:10px}
.ov-title{flex:1;min-width:0;font-size:23px;font-weight:700;letter-spacing:-.4px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-spend{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding-left:6px}
.ov-spend .lb{font-size:10px;color:var(--ink3)}
.ov-spend .v{font-size:19px;font-weight:700;color:var(--mint-deep);line-height:1;display:flex;align-items:center;gap:3px}
.ov-hr{height:1px;background:#E6E2F4;margin:10px 0}
.ov-r3{display:flex;gap:12px;align-items:stretch}
.ov-map{flex:0 0 88px;width:88px;height:88px;border-radius:13px;background:var(--card);border:1px solid var(--violet-line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.ov-map img{width:100%;height:100%;object-fit:cover;display:block}
.ov-map .ph{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--violet-deep);font-size:10px;text-align:center;line-height:1.3;padding:4px}
.ov-facts{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.fact{display:flex;align-items:center;gap:7px;min-width:0}
.fact svg{flex:0 0 auto;color:var(--ink3)}
.fact .t{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fact .t b{font-weight:600}
.fact .t em{font-style:normal;color:var(--ink2)}

/* ── 贴纸 ── */
.stklayer{position:absolute;inset:0;pointer-events:none;border-radius:16px}
.stkpad{position:absolute;inset:0;z-index:1;border-radius:16px}
.stkbox{position:absolute;z-index:2;pointer-events:auto}
.stkbox .frame{position:absolute;border-radius:12px;border:1.5px dashed var(--violet);background:rgba(255,255,255,.34);pointer-events:none;opacity:0}
.stkbox .emo{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;background:none;border:0;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 2px 3px rgba(28,25,48,.24))}
.stkbox .hx,.stkbox .hz{position:absolute;z-index:3;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(28,25,48,.3);opacity:0;pointer-events:none;touch-action:none}
.stkbox .hx{background:var(--danger)}
.stkbox .hz{background:var(--violet);cursor:nwse-resize}
.stkbox.live .frame,.stkbox.live .hx,.stkbox.live .hz{opacity:1}
.stkbox.live .hx,.stkbox.live .hz{pointer-events:auto}
.stkadd{position:absolute;right:4px;bottom:2px;z-index:3;width:30px;height:30px;pointer-events:auto;border-radius:50%;border:1px dashed var(--violet-line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--violet)}
.stktip{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);z-index:4;pointer-events:none;padding:4px 10px;border-radius:999px;background:var(--violet-deep);color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap}
.emopanel{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emopanel button{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:23px;border-radius:10px;background:var(--ground);border:1px solid var(--line)}

/* ── 吸顶：主 tab + 日期条 ── */
.sticky{position:sticky;top:0;z-index:3;background:var(--card);box-shadow:0 4px 10px rgba(28,25,48,.05)}
.tabs{display:flex;padding:0 16px;gap:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs button{padding:11px 0 9px;font-size:15px;color:var(--ink3);position:relative;font-weight:500}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-1px;width:22px;height:2.5px;border-radius:2px;background:var(--violet)}
.tabs .sp{flex:1}
.gear{padding:11px 0 9px;color:var(--ink3);position:relative}
.gear .dot{position:absolute;top:10px;right:-3px;width:6px;height:6px;border-radius:50%;background:#E8A33D}
.striprow{display:flex;align-items:center}
.datestrip{flex:1;min-width:0;display:flex;gap:7px;overflow-x:auto;padding:8px 16px}
.backtoday{flex:0 0 auto;margin:0 12px 0 2px;min-height:34px;display:flex;align-items:center;gap:4px;padding:0 10px;border-radius:999px;border:1px solid var(--violet-line);background:var(--violet-hl);font-size:11.5px;font-weight:600;color:var(--violet-deep);white-space:nowrap}
.dtab{position:relative;flex:0 0 auto;min-width:70px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:center}
.dtab.today{border-color:#9ACFC5}
.dtab.today .n{color:var(--mint-deep);font-weight:700}
.dtab.today .c{color:var(--mint-deep)}
.dtab .tdot{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:3px;background:var(--mint)}
.dtab.on .tdot{background:#DDD4FF}
.dtab.on.today .n,.dtab.on.today .c{color:#DDD4FF}
.dtab .n{display:block;font-size:10.5px;color:var(--ink3);line-height:1.35}
.dtab .d{display:block;font-size:14.5px;font-weight:700;line-height:1.3;margin:1px 0}
.dtab .c{display:block;font-size:10.5px;color:var(--ink2);line-height:1.35;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtab.on{background:var(--violet);border-color:var(--violet)}
.dtab.on .n,.dtab.on .c{color:#DDD4FF}
.dtab.on .d{color:#fff}
.dtab.past .n,.dtab.past .d{color:var(--ink3)}

/* ── 天气 ── */
.wx{display:flex;gap:8px;margin:10px 16px 2px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.wx .cell{flex:1;display:flex;align-items:center;gap:6px;justify-content:center}
.wx .cell+.cell{border-left:1px solid var(--line)}
.wx .lb{font-size:11px;color:var(--ink3)}
.wx .tp{font-size:14px;font-weight:600}
.wx svg{color:var(--violet)}
.wx .nodata{flex:1;text-align:center;font-size:12px;color:var(--ink3)}

/* ── 时间轴 ── */
.tl{padding:10px 16px 0;touch-action:pan-y}
.row{position:relative;margin-bottom:8px;display:flex;gap:9px}
.row.open{z-index:5}
.rtime{flex:0 0 40px;width:40px;padding-top:11px;text-align:right}
.rtime span{font-size:13px;font-weight:600}
.rrail{flex:0 0 11px;width:11px;display:flex;flex-direction:column;align-items:center}
.rrail .dot{width:9px;height:9px;border-radius:5px;margin-top:15px;flex:0 0 auto}
.rrail .line{width:2px;flex:1 1 auto;background:var(--line)}
.rbody{flex:1 1 auto;min-width:0;position:relative}
.card{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.card.now{background:var(--violet-hl);border-color:var(--violet)}
.card.past{opacity:.66}
.c-top{display:flex;align-items:flex-start;gap:9px}
.c-place{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
.c-chip{flex:0 0 auto;font-size:12.5px;font-weight:700;letter-spacing:.2px;padding:4px 10px;border-radius:9px;background:var(--violet-tint);color:var(--violet-deep)}
.c-note{font-size:12px;color:var(--ink2);line-height:1.45;margin-top:5px;word-break:break-word}
.c-bot{display:flex;align-items:center;gap:6px;margin-top:6px}
.c-dur{font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.c-badges{display:flex;gap:6px;align-items:center;margin-left:auto}
.bdg{display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--ink3)}
.c-cny{font-size:12.5px;font-weight:700;color:var(--mint-deep)}
.c-go{color:var(--violet-line);flex:0 0 auto}

/* 长按浮层 */
.pop{position:absolute;z-index:6;right:4px;top:100%;margin-top:3px;display:flex;gap:6px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 22px rgba(28,25,48,.16)}
.pop button{min-height:40px;padding:0 16px;border-radius:10px;background:var(--violet-tint);color:var(--violet-deep);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pop button.del{background:var(--danger-tint);color:var(--danger)}
.backdrop{position:fixed;inset:0;z-index:4;background:transparent}
.lprow{border-radius:9px}
.lprow.hot{background:var(--violet-hl)}

/* 当天页脚 */
.dayfoot{margin:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.money{display:flex;align-items:stretch;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.money .look{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 12px}
.money .look .lb{font-size:11.5px;color:var(--ink2)}
.money .look .v{font-size:16px;font-weight:700;color:var(--mint-deep)}
.money .look .n{margin-left:auto;font-size:11px;color:var(--ink3)}
.money .sp{width:1px;background:var(--line);margin:9px 0}
.money .add{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 13px;font-size:12.5px;font-weight:600;color:var(--violet-deep)}
.dash{min-height:46px;border-radius:12px;border:1px dashed var(--violet-line);background:var(--violet-hl);color:var(--violet-deep);font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.jrn{width:100%;min-height:58px;border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:5px;border:1px dashed #C9E8E0;background:var(--ground)}
.jrn.has{border-style:solid;border-color:#9ACFC5;background:var(--mint-tint)}
.jrn .l1{display:flex;align-items:center;gap:6px}
.jrn .l1 .t{font-size:11.5px;font-weight:600;color:var(--mint-deep);letter-spacing:.3px}
.jrn .l1 .a{margin-left:auto;font-size:11px;color:var(--ink2)}
.jrn .tx{font-size:13px;line-height:1.55;color:var(--ink3);white-space:pre-wrap;word-break:break-word}
.jrn.has .tx{color:var(--ink)}
</style>
<style>
/* ── 凭证 ── */
.sec{margin:14px 16px 0}
.sec-h{display:flex;align-items:baseline;gap:7px;margin:0 2px 8px}
.sec-h .t{font-size:13px;font-weight:700;letter-spacing:.3px}
.sec-h .n{font-size:11px;color:var(--ink3)}
.maskbar{margin:12px 16px 0;padding:9px 12px;background:var(--violet-hl);border:1px solid var(--violet-line);border-radius:11px;font-size:12px;color:var(--violet-deep);display:flex;gap:7px;align-items:center}
.vrow{display:flex;align-items:center;gap:11px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px}
.vthumb{flex:0 0 42px;width:42px;height:52px;border-radius:7px;overflow:hidden;background:var(--violet-hl);border:1px solid var(--violet-line);display:flex;align-items:center;justify-content:center;color:#9A8FD6}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vmain{flex:1;min-width:0}
.vmain .t{display:block;font-size:14px;font-weight:600;line-height:1.35;word-break:break-word}
.vmain .s{display:block;font-size:11.5px;color:var(--ink2);margin-top:2px}
.vmain .c{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.vmain .c b{font-weight:600;color:var(--violet-deep);letter-spacing:.3px}
.vmain .use{display:flex;align-items:center;gap:4px;margin-top:3px;color:var(--ink3)}
.vmain .use.on{color:var(--mint-deep)}
.vmain .use svg{flex:0 0 auto}
.vmain .use span{font-size:10.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmain .use.on span{font-weight:600}
.vgo{flex:0 0 auto;min-height:40px;display:flex;align-items:center;padding:0 13px;border-radius:11px;background:var(--violet-tint);font-size:12.5px;font-weight:600;color:var(--violet-deep)}
.addbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 32px);margin:14px 16px 0;min-height:46px;border-radius:13px;border:1.5px dashed var(--violet-line);background:var(--violet-hl);color:var(--violet-deep);font-size:14px;font-weight:600}

/* ── 旧速查样式已被新版取代，只留空态 ── */
.hint{margin:8px 2px 0;font-size:11.5px;color:var(--ink3);line-height:1.6}
.empty{margin:14px 0;padding:22px 16px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.7;background:var(--card);border:1px dashed var(--violet-line);border-radius:14px}
.empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:4px}

/* ══ 速查：四张白卡 ══ */
.esswrap{padding:11px 16px 0;display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.escard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px}
.escard.p11{padding:11px}
.escard .eh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px 8px}
.escard .eh .t{font-size:11.5px;font-weight:600;color:var(--violet-deep);letter-spacing:.3px}
.escard .eh .s{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
.escard .ehb{width:100%;box-sizing:border-box;min-height:44px;display:flex;align-items:center;gap:8px;
  padding:0 2px;background:none;border:none;font-family:inherit;cursor:pointer;text-align:left}
.escard .ehb .t{font-size:11.5px;font-weight:600;color:var(--violet-deep);letter-spacing:.3px}
.escard .ehb .s{flex:1;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.escard .ehb .cv{flex:0 0 auto;display:flex;color:var(--ink3);transition:transform .16s}
.escard .ehb.on .cv{transform:rotate(180deg)}
.escard .ehint{display:block;font-size:10px;color:var(--ink3);padding:0 2px 8px}
.esempty{font-size:11.5px;color:var(--ink3);padding:10px 2px;line-height:1.6}

/* 地址 */
.acats{display:flex;gap:7px;margin-bottom:8px}
.acats button{flex:1;min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.acats button .l{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
.acats button .c{display:block;font-size:10px;color:var(--ink2)}
.acats button.on{background:var(--violet);border-color:var(--violet)}
.acats button.on .l{color:#fff}
.acats button.on .c{color:#DDD4FF}
.alist{display:flex;flex-direction:column;gap:7px}
.awrap{position:relative}
.awrap:has(.pop){z-index:6}
.arow{border-radius:13px;overflow:hidden;background:var(--ground);border:1px solid var(--line)}
.arow.open{background:var(--violet-hl);border-color:#C9BFF2}
.ahead{width:100%;min-height:44px;display:flex;align-items:center;gap:9px;padding:0 11px;background:transparent}
.ahead>svg{flex:0 0 auto;color:var(--violet)}
.ahead .t{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahead .w{flex:0 0 auto;font-size:10.5px;color:var(--ink2)}
.ahead .cv{flex:0 0 auto;color:var(--ink3);transition:transform .16s;display:flex}
.arow.open .ahead .cv{transform:rotate(180deg)}
.abody{display:block;padding:0 11px 11px 35px}
.abody .ad{display:block;font-size:15px;font-weight:600;line-height:1.4;word-break:break-word}
.abody .an{display:block;font-size:11.5px;color:var(--ink2);line-height:1.4;margin-top:4px}
.abody .acts{display:flex;gap:7px;padding-top:8px}
.abody .cp{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;background:var(--violet);color:#fff;font-size:12.5px;font-weight:600}
.abody .mp{width:92px;flex:0 0 92px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;color:var(--violet-deep);text-decoration:none}
.pop-a{right:6px;top:38px}

/* 交通 */
.twrap{position:relative}
.twrap:has(.pop){z-index:6}
.tmode{display:block;font-size:10.5px;font-weight:600;color:var(--violet-deep);padding:7px 0 2px}
.trow2{width:100%;min-height:42px;display:flex;align-items:center;gap:9px;background:transparent}
.trow2>svg{flex:0 0 auto;color:var(--ink3)}
.trow2 .no{flex:0 0 auto;font-size:13px;font-weight:600}
.trow2 .meta{flex:1;min-width:0;font-size:10.5px;color:var(--ink2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-b{right:0;top:100%;margin-top:-4px}

/* 行李 */
.ptrack{height:5px;border-radius:3px;background:var(--violet-tint);overflow:hidden;margin-bottom:9px}
.ptrack .pfill{height:5px;background:var(--violet);border-radius:3px;transition:width .2s}
.plist{display:flex;flex-direction:column;gap:6px}
.pcat{border-radius:13px;background:var(--ground);border:1px solid var(--line)}
.pcat.open{background:var(--violet-hl);border-color:#C9BFF2}
.pcat .h{width:100%;min-height:44px;display:flex;align-items:center;gap:9px;padding:0 11px;background:transparent}
.pcat .h .ico{flex:0 0 24px;width:24px;height:24px;border-radius:8px;background:var(--violet-tint);color:var(--violet-deep);display:flex;align-items:center;justify-content:center}
.pcat.all .h .ico{background:var(--mint-tint);color:var(--mint-deep)}
.pcat .h .t{flex:1;font-size:13.5px;font-weight:600}
.pcat .h .n{flex:0 0 auto;font-size:10.5px;font-weight:600;color:var(--ink2)}
.pcat.all .h .n{color:var(--mint-deep)}
.pcat .h .cv{flex:0 0 auto;color:var(--ink3);transition:transform .16s;display:flex}
.pcat.open .h .cv{transform:rotate(180deg)}
.pcat .b{padding:0 11px 8px;display:flex;flex-direction:column;gap:1px}
.pwrap{position:relative}
.pwrap:has(.pop){z-index:6}
.pitem{width:100%;min-height:40px;display:flex;align-items:center;gap:10px;background:transparent}
.pbox{flex:0 0 21px;width:21px;height:21px;border-radius:7px;border:1.6px solid #D6D1E8;background:var(--card);display:flex;align-items:center;justify-content:center;color:#fff}
.pitem.done .pbox{background:var(--mint);border-color:var(--mint)}
.pitem .tx{flex:1;min-width:0;font-size:13px;line-height:1.35;word-break:break-word}
.pitem.done .tx{color:var(--ink3);text-decoration:line-through}

/* 紧急联系 */
.qrow{display:flex;gap:8px;margin-bottom:8px}
.qwrap{position:relative;flex:1}
.qwrap:has(.pop){z-index:6}
.qbtn{width:100%;min-height:56px;border-radius:13px;background:var(--danger-tint);border:1px solid #F2D5D5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.qbtn .no{display:block;font-size:19px;font-weight:700;color:var(--danger)}
.qbtn .l{display:block;font-size:11px;color:var(--danger)}
.pop-q{left:50%;right:auto;transform:translateX(-50%);top:100%;margin-top:4px}
.swrap{position:relative}
.swrap:has(.pop){z-index:6}
.srow2{width:100%;min-height:42px;display:flex;align-items:center;gap:10px;background:transparent}
.srow2 .g{flex:1;min-width:0}
.srow2 .g .t{display:block;font-size:12.5px}
.srow2 .g .n{display:block;font-size:10.5px;color:var(--ink3);line-height:1.4;word-break:break-word}
.srow2 .no{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--violet-deep)}
.srow2>svg{flex:0 0 auto;color:var(--violet)}

/* 置顶大号开关 */
.qtog{display:flex;align-items:center;gap:9px;width:100%;min-height:46px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--card)}
.qtog .g{flex:1;min-width:0}
.qtog .g .t{display:block;font-size:13px;font-weight:600}
.qtog .g .s{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.qtog .sw{flex:0 0 44px;width:44px;height:26px;border-radius:13px;background:#D6D1E8;position:relative;transition:background .16s}
.qtog .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .16s}
.qtog.on{border-color:var(--violet)}
.qtog.on .sw{background:var(--violet)}
.qtog.on .sw i{left:21px}

/* ── 底部 sheet ── */
.mask{position:fixed;inset:0;z-index:20;background:rgba(28,25,48,.4);opacity:0;animation:fade .18s forwards}
@keyframes fade{to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(100%);animation:up .24s cubic-bezier(.32,.72,0,1) forwards;padding-bottom:var(--safeB)}
@keyframes up{to{transform:translateY(0)}}
.sh-h{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:15px 16px 11px;border-bottom:1px solid var(--line)}
.sh-h .t{flex:1;min-width:0;font-size:16px;font-weight:700}
.sh-h .t em{display:block;font-style:normal;font-size:11px;color:var(--ink3);font-weight:400;margin-top:2px}
.sh-h .x{width:32px;height:32px;border-radius:50%;background:var(--ground);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:0 0 auto}
.sh-b{flex:1 1 auto;overflow-y:auto;padding:14px 16px 6px;-webkit-overflow-scrolling:touch}
.sh-f{flex:0 0 auto;padding:10px 16px calc(16px + var(--safeB));border-top:1px solid var(--line)}
.sh-f .tip{font-size:10.5px;color:var(--ink3);text-align:center;margin-top:6px;line-height:1.5}

/* 表单 */
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.f label .req{color:var(--danger);margin-left:3px;font-size:11px}
.f label .opt{color:var(--ink3);margin-left:3px;font-weight:400}
.f input,.f textarea,.f select{width:100%;min-height:44px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:15px;outline:none}
.f textarea{min-height:110px;resize:vertical;line-height:1.6}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--violet)}
.f .row2{display:flex;gap:9px}
.f .row2>*{flex:1}
.f .mini{font-size:10.5px;color:var(--ink3);margin-top:5px;line-height:1.5}
.f .mini.ok{color:var(--mint-deep)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--ink);min-height:36px;font-weight:600}
.fchips button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.err{font-size:12.5px;color:var(--danger);margin-bottom:10px}
.btn{width:100%;min-height:48px;border-radius:13px;background:var(--violet);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--violet-hl);color:var(--violet-deep);border:1px solid var(--violet-line)}
.btn.grey{background:var(--card);color:var(--ink2);border:1px solid var(--line)}
.btn.danger{background:var(--danger-tint);color:var(--danger);border:1px solid #F2D5D5}
.btn.dim{background:#C9BFF2}
.btn+.btn{margin-top:9px}
.btnrow{display:flex;gap:8px}
.btnrow .btn+.btn{margin-top:0}

/* 批量块 */
.blk{border:1px solid var(--line);border-radius:14px;margin-bottom:9px;background:var(--card)}
.blk.on{border-color:var(--violet);background:var(--ground)}
.blk.bad{border-color:var(--violet-line)}
.blk .bh{display:flex;align-items:center;gap:8px;padding:0 11px;min-height:44px}
.blk .num{flex:0 0 20px;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--violet-tint);color:var(--violet-deep)}
.blk.ok .num{background:var(--mint-tint);color:var(--mint-deep)}
.blk.bad .num{background:var(--danger-tint);color:var(--danger)}
.blk .sum{flex:1;min-width:0;display:flex;align-items:center;gap:7px;overflow:hidden}
.blk .sum .cp{flex:0 0 auto;font-size:10px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--violet-tint);color:var(--violet-deep)}
.blk .sum .wh{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--violet-deep)}
.blk .sum .pl{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .sum .st{font-size:12.5px;font-weight:600;color:var(--violet-deep);display:flex;align-items:center;gap:5px}
.blk .rm{flex:0 0 30px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--danger)}
.blk .bb{padding:2px 11px 12px}
.rowline{display:flex;align-items:center;gap:8px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:8px}
.rowline.ok{border-color:var(--line)}
.rowline.bad{border-color:var(--violet-line)}
.rowline .num{flex:0 0 19px;width:19px;height:19px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;background:var(--violet-tint);color:var(--violet-deep)}
.rowline.ok .num{background:var(--mint-tint);color:var(--mint-deep)}
.rowline input,.rowline select{min-height:42px;border-radius:9px;padding:8px 10px;border:1px solid var(--line);background:var(--ground);font-size:14px;outline:none;width:100%}
.rowline .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rowline .rm{flex:0 0 26px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--danger)}
.rowline .cny{font-size:11px;color:var(--ink3);padding-left:2px}
.rowline .cny.ok{color:var(--mint-deep);font-weight:600}
.sprow{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sprow input[type=text]{flex:1;min-width:0;min-height:42px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13px;outline:none}
.sprow input[inputmode=decimal]{flex:0 0 84px;width:84px;font-size:14px;font-weight:700}
.sprow select{flex:0 0 76px;width:76px;min-height:42px;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:12px;outline:none}
.sprow .rm{flex:0 0 26px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--danger)}
.sprow .spadd{flex:1;min-height:38px;border-radius:9px;border:1px dashed var(--violet-line);background:var(--violet-hl);color:var(--violet-deep);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.sprow .spsum{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--ink3)}
.sprow .spsum.ok{color:var(--mint-deep)}
.morebtn{width:100%;min-height:46px;border-radius:12px;border:1px dashed var(--violet-line);background:var(--violet-hl);color:var(--violet-deep);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:9px}

/* 凭证挑选 */
.vpick{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:7px;border:1px solid var(--line);border-radius:11px;background:var(--card);margin-top:8px}
.vpick .it{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
.vpick .it.on{border-color:var(--violet);background:var(--ground)}
.vpick .bx{flex:0 0 17px;width:17px;height:17px;border-radius:5px;border:1.5px solid #D6D1E8;display:flex;align-items:center;justify-content:center;color:#fff}
.vpick .it.on .bx{background:var(--violet);border-color:var(--violet)}
.vpick .cp{flex:0 0 auto;font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--violet-hl);color:var(--violet-deep)}
.vpick .g{flex:1;min-width:0}
.vpick .g .t{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vpick .g .s{display:block;font-size:10.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtag{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;background:var(--violet-hl);border:1px solid var(--violet-line);margin-bottom:6px}
.vtag .cp{flex:0 0 auto;font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:5px;background:#fff;color:var(--violet-deep)}
.vtag .g{flex:1;min-width:0}
.vtag .g .t{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtag .g .s{display:block;font-size:10.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtag .rm{flex:0 0 26px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--danger)}

/* 花费明细 */
.dsgrp{padding:9px 0 5px;border-bottom:1px solid #F3F1FA}
.dsgrp .gh{display:flex;align-items:baseline;gap:7px}
.dsgrp .gh .cp{flex:0 0 auto;font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--violet-tint);color:var(--violet-deep)}
.dsgrp .gh .t{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsgrp .gh .v{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--mint-deep)}
.srow{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 8px;position:relative;border-radius:9px}
.srow .d{flex:0 0 4px;width:4px;height:4px;border-radius:2px;background:#9ACFC5}
.srow .t{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .o{flex:0 0 auto;font-size:10.5px;color:var(--ink3)}
.srow .c{flex:0 0 auto;font-size:12.5px;font-weight:600}
.stot{display:flex;align-items:center;gap:10px}
.stot .g{flex:1}
.stot .g .l{display:block;font-size:10.5px;color:var(--ink3)}
.stot .g .v{display:block;font-size:20px;font-weight:700;color:var(--mint-deep)}
.stot .btn{width:auto;flex:0 0 auto;padding:0 18px;min-height:46px;font-size:13.5px}

/* ── 详情层 ── */
#detail{position:absolute;inset:0;z-index:14;background:var(--ground);display:flex;flex-direction:column}
#detail .dtop{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);padding-top:var(--safeT)}
#detail .dtop .in{display:flex;align-items:center;gap:4px;padding:0 8px;min-height:46px}
#detail .dtop .in .t{font-size:13.5px;font-weight:500;color:var(--violet-deep)}
#detail .dbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(24px + var(--safeB))}
.dhead{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.dhead .l1{display:flex;align-items:center;gap:8px}
.dhead .when{font-size:11.5px;color:var(--ink2)}
.dhead .pl{font-size:20px;font-weight:700;line-height:1.25;word-break:break-word}
.dhead .nt{font-size:12.5px;color:var(--ink2);line-height:1.45;word-break:break-word}
.dhead .ed{align-self:flex-start;margin-top:3px;min-height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:11.5px;font-weight:600;color:var(--violet-deep);display:flex;align-items:center;gap:5px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.dcard .ch{display:flex;align-items:center;gap:7px}
.dcard .ch .t{font-size:11.5px;font-weight:600;color:var(--violet-deep);letter-spacing:.3px}
.dcard .ch .pin{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;background:#F0EEF7;color:var(--ink2)}
.dcard .ch .pin.on{background:var(--mint-tint);color:var(--mint-deep)}
.dcard .ch .r{margin-left:auto;display:flex;gap:6px}
.dcard .ch .r button{min-height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:11.5px;font-weight:600;color:var(--violet-deep)}
.dcard .ch .v{margin-left:auto;font-size:15px;font-weight:700;color:var(--mint-deep)}
.dcard .addr{font-size:14.5px;font-weight:600;line-height:1.4;word-break:break-word}
.gomap{min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;background:var(--violet);color:#fff;font-size:13px;font-weight:600;text-decoration:none}
.dcard .note{font-size:10.5px;color:var(--ink3);line-height:1.5}
.nrow{display:flex;align-items:center;gap:8px;min-height:40px;padding:3px 7px;border-radius:9px;position:relative}
.nrow .d{flex:0 0 4px;width:4px;height:4px;border-radius:2px;background:var(--mint);margin:0 5px}
.nrow .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.45;word-break:break-word}

/* 一键出示 */
#show{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column;padding-top:var(--safeT);padding-bottom:var(--safeB);max-width:520px;margin:0 auto}
#show .sh-top{display:flex;align-items:center;gap:10px;padding:12px 16px}
#show .sh-top .t{flex:1;min-width:0;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#show .codebar{margin:0 16px 10px;padding:12px 14px;background:var(--violet-hl);border:1px solid var(--violet-line);border-radius:13px}
#show .codebar .lb{font-size:11px;color:var(--violet-deep);opacity:.8}
#show .codebar .cd{font-size:23px;font-weight:700;letter-spacing:1.5px;color:var(--violet-deep);margin-top:2px;word-break:break-all}
#show .codebar .who{font-size:12px;color:var(--ink2);margin-top:5px}
#show .pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;background:#F2F1F7}
#show .pages img{width:100%;display:block;border-radius:10px;margin-top:12px;box-shadow:0 2px 10px rgba(28,25,48,.1);background:#fff}
#show .foot{padding:9px 16px;font-size:11.5px;color:var(--ink3);text-align:center;border-top:1px solid var(--line)}

/* 导入引导 */
#gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center;gap:6px}
#gate .logo{width:64px;height:64px;border-radius:18px;background:var(--violet);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:14px}
#gate h1{font-size:21px;font-weight:700;margin:0}
#gate p{font-size:13.5px;color:var(--ink2);line-height:1.7;margin:4px 0 20px;max-width:320px}
#gate .btn{max-width:300px}
#gate .note{font-size:11.5px;color:var(--ink3);margin-top:16px;line-height:1.7;max-width:320px}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--safeB));transform:translateX(-50%);z-index:60;background:rgba(28,25,48,.93);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:999px;max-width:88%;text-align:center;animation:fade .16s}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.setrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.setrow .g{flex:1;min-width:0}
.setrow .g .t{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>

const I={

  pen:'<path d="M4.5 19.5h4l10-10a2.1 2.1 0 0 0-3-3l-10 10z"/>',
  copy:'<rect x="9" y="9" width="11.5" height="11.5" rx="2.5"/><path d="M5 15.5V5.5a2.5 2.5 0 0 1 2.5-2.5H17"/>',
  quote:'<path d="M9.5 6H7a1.5 1.5 0 0 0-1.5 1.5v2A1.5 1.5 0 0 0 7 11h2.5zM9.5 6v5c0 3.6-1.4 5.9-3.8 7M18.5 6H16a1.5 1.5 0 0 0-1.5 1.5v2A1.5 1.5 0 0 0 16 11h2.5zM18.5 6v5c0 3.6-1.4 5.9-3.8 7"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7h-.3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1A1.6 1.6 0 0 0 10.2 4v-.3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.5 1z"/>',
  up:'<path d="M12 16.5V4M7.5 8.5L12 4l4.5 4.5M4.5 16.5v2a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2"/>',
  dl:'<path d="M12 4v12.5M7.5 12L12 16.5 16.5 12M4.5 16.5v2a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2"/>',
  bag:'<path d="M4.5 8h15l-1 11.5a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8z"/><path d="M8.8 8V6a3.2 3.2 0 0 1 6.4 0v2"/>',
  phone:'<path d="M6.5 3.5h3l1.5 4-2 1.3a12 12 0 0 0 5.2 5.2l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2z"/>',
  home:'<path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/>',
  plane:'<path d="M3.5 13 21 5l-4 8.5 1 6-3-2.5-3 3-1-4.5z"/>',
  train:'<rect x="5" y="3.5" width="14" height="13" rx="3"/><path d="M5 11h14M8.5 20.5l2-4M15.5 20.5l-2-4"/><circle cx="8.8" cy="13.8" r=".9" fill="currentColor"/><circle cx="15.2" cy="13.8" r=".9" fill="currentColor"/>',
  bus:'<rect x="4" y="4" width="16" height="12.5" rx="2.5"/><path d="M4 11h16M7 20v-3.5M17 20v-3.5"/><circle cx="7.8" cy="13.8" r=".9" fill="currentColor"/><circle cx="16.2" cy="13.8" r=".9" fill="currentColor"/>',
  wSun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>',
  wPart:'<circle cx="9" cy="9" r="3.2"/><path d="M9 2.8v1.6M2.8 9h1.6M4.9 4.9l1.1 1.1M13.1 4.9 12 6"/><path d="M8 18.5a3.5 3.5 0 0 1 .6-7 5 5 0 0 1 9.5 1.5 3 3 0 0 1-.6 5.5z"/>',
  wCloud:'<path d="M7.5 19a4 4 0 0 1 .7-8 5.5 5.5 0 0 1 10.4 1.6A3.5 3.5 0 0 1 17.5 19z"/>',
  wRain:'<path d="M7.5 15.5a4 4 0 0 1 .7-8 5.5 5.5 0 0 1 10.4 1.6 3.5 3.5 0 0 1-1.1 6.4"/><path d="M9 18.5l-1 2.5M13 18.5l-1 2.5M17 18.5l-1 2.5"/>',
};
const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pName=x=>(x&&x.place&&x.place.trim())?x.place:((x&&x.theme)||'');
const pad=n=>String(n).padStart(2,'0');
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowHM(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
const mins=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:-1;};
const md=iso=>iso?iso.slice(5,7)+'.'+iso.slice(8,10):'';
const mdSlash=iso=>iso?iso.slice(5,7)+'/'+iso.slice(8,10):'';
function wkd(iso){if(!iso)return'';return'日一二三四五六'[new Date(iso+'T12:00:00').getDay()];}
function seasonOf(iso){const m=+((iso||'').slice(5,7));if(m>=3&&m<=5)return'春';if(m>=6&&m<=8)return'夏';if(m>=9&&m<=11)return'秋';if(m===12||m===1||m===2)return'冬';return'—';}
function money(n){return'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0});}
function nDays(a,b){if(!a||!b)return 0;return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)+1;}
function durText(a,b){const d=mins(b)-mins(a);if(mins(a)<0||mins(b)<0||d<=0)return'';const H=Math.floor(d/60),M=d%60;return (H?H+' 小时':'')+(H&&M?' ':'')+(M?M+' 分':'');}
function durMins(t){const H=/(\d+)\s*小时/.exec(String(t||'')),M=/(\d+)\s*分/.exec(String(t||''));return (H?+H[1]*60:0)+(M?+M[1]:0);}
function addMins(t,d){if(!d||mins(t)<0)return'';const v=mins(t)+d;return pad(Math.floor(v/60)%24)+':'+pad(v%60);}
let toastT=0;
function toast(msg){const o=document.querySelector('.toast');if(o)o.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2400);}

/* ══════════ 存储 ══════════ */
const LS='trip-quickref-v2';
const IDB_DB='tripQuickref', IDB_ST='blobs';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(IDB_ST))r.result.createObjectStore(IDB_ST);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction(IDB_ST,'readonly').objectStore(IDB_ST).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}catch(e){return undefined;}}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(IDB_ST,'readwrite');tx.objectStore(IDB_ST).put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);});}
let DB={trips:[],cur:''}, IMGS={};
function save(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){toast('保存失败，可能是本机存储满了');}}
async function saveImgs(){try{await idbSet('images',IMGS);}catch(e){toast('凭证图保存失败');}}
function pic(k){return k&&IMGS[k]?IMGS[k]:'';}
function T(){return DB.trips.find(t=>t.id===DB.cur)||null;}

/* ══════════ 界面状态 ══════════ */
const S={screen:'trips',tab:'plan',day:0,acat:'住宿',aopen:'',popen:'',menu:'',oAddr:false,oTran:false,oPack:false,sheet:'',arg:null,open:'',err:'',vshow:null,wxTried:false,stk:'',buf:null,pick:''};
function setS(o){Object.assign(S,o);render();}
const THEMES=['起床','游玩','吃饭','逛街','移动','睡觉','其他'];
const CHIP={
  '起床':['#FDEFC4','#7E5B12'],   // 清晨的暖黄
  '游玩':['#E8E1FF','#4B2FB8'],   // 主角，用品牌紫
  '吃饭':['#FFE3D0','#9B4A17'],   // 暖橘
  '逛街':['#FFDFEA','#9C3359'],   // 玫红
  '移动':['#E9E7F0','#5F5A78'],   // 过渡，冷灰往后退
  '睡觉':['#D9E2F8','#33447F'],   // 夜里的靛蓝
  '其他':['#EDEAE2','#6B6152']    // 暖灰
};
function chipOf(th){const c=CHIP[th]||['#EFEBFF','#4B2FB8'];return 'background:'+c[0]+';color:'+c[1];}
const CUR=['EUR','CNY','USD','JPY'];
const CURNAME={EUR:'欧元',CNY:'人民币',USD:'美元',JPY:'日元'};
const VCAT={stay:'住宿',move:'交通',see:'游览',other:'其他'};
const EMOJI=[
 ['😍','🥹','😂','🤩','😭','🥰','😴','🤯'],
 ['✈️','🚄','🚌','⛵️','🧳','🗺️','📸','🎫'],
 ['🍕','🍝','🍋','🍷','🍨','☕️','🍅','🧀'],
 ['🏛️','⛪️','🌋','🗿','🎨','🏖️','⛰️','🌅'],
 ['☀️','🌊','🌙','⭐️','🌈','🌸','🍂','☔️'],
 ['❤️','✨','🎉','👍','💯','🔥','🏆','📌'],
];
const MIN_SZ=26, MAX_SZ=76;

/* ══════════ 派生数据 ══════════ */
function rate(cur){const t=T();if(!cur||cur==='CNY')return 1;const r=((t&&t.meta.rate)||{})[cur];return r||1;}
function toCNY(a,c){return Number(a||0)*rate(c);}
function allSpends(){const t=T();return (t&&t.spends)||[];}
function spendsOfItem(id){return allSpends().filter(x=>x.itemId===id);}
function itemCNY(it){return spendsOfItem(it.id).reduce((s,x)=>s+toCNY(x.amount,x.cur),0);}
function looseOfDate(d){return allSpends().filter(x=>!x.itemId&&x.date===d);}
function spentOn(date){const t=T();if(!t)return 0;const day=t.days.find(d=>d.date===date);const inItems=day?day.items.reduce((s,it)=>s+itemCNY(it),0):0;return inItems+looseOfDate(date).reduce((s,x)=>s+toCNY(x.amount,x.cur),0);}
function spentTotal(){const t=T();if(!t)return 0;return t.days.reduce((s,d)=>s+spentOn(d.date),0);}
function findItem(id){const t=T();if(!t)return null;for(const d of t.days){const x=d.items.find(i=>i.id===id);if(x)return x;}return null;}
function findDayOf(id){const t=T();if(!t)return null;return t.days.find(d=>d.items.some(i=>i.id===id));}
function vouById(id){const t=T();return (t&&t.vouchers||[]).find(v=>v.id===id)||null;}
// 这张票挂在哪几程上 —— 站在闸机口不用靠名字猜
function vouUse(id,title){
  const t=T();if(!t)return [];
  const out=[];
  const tt=String(title||'').trim();
  t.days.forEach((d,di)=>d.items.forEach(it=>{
    if((it.vouchers||[]).indexOf(id)<0)return;
    const nm=pName(it);
    // 行程名和票名基本是同一个东西时就别再重复一遍，只留「第几天几点」
    const echo=tt&&nm&&(nm.indexOf(tt)>=0||tt.indexOf(nm)>=0||nm.indexOf(tt.slice(0,8))>=0);
    out.push('Day '+(di+1)+' '+(it.time||'')+(echo?'':' '+nm));
  }));
  return out;
}
function packStat(){const t=T();const P=(t&&t.packing)||[];let done=0,all=0;P.forEach(c=>c.items.forEach(x=>{all++;if(x.done)done++;}));return{done,all};}
function daysSinceExport(){const t=T();if(!t||!t.lastExport)return 99;return Math.floor((Date.now()-new Date(t.lastExport).getTime())/864e5);}
function mapHref(it){const t=T();if(it.map&&it.map.trim())return it.map.trim();const q=(it.place||'')+' '+((t&&t.meta.country)||'');return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q.trim());}
function mapSearchText(it){const t=T();return ((it.place||'')+' '+((t&&t.meta.country)||'')).trim();}

/* ══════════ 联网：天气 / 汇率 ══════════ */
const WMO={0:'wSun',1:'wSun',2:'wPart',3:'wCloud',45:'wCloud',48:'wCloud',51:'wRain',53:'wRain',55:'wRain',61:'wRain',63:'wRain',65:'wRain',71:'wRain',80:'wRain',81:'wRain',82:'wRain',95:'wRain',96:'wRain',99:'wRain'};
const wIcon=c=>svg(I[WMO[c]||'wCloud'],15);
async function refreshWeather(){
  const t=T();if(!t||!navigator.onLine)return;
  const spots=t.meta.spots||{};const wx=t.weather=t.weather||{};S.wxTried=false;
  const jobs=Object.keys(spots).map(async city=>{
    const [la,lo]=spots[city];
    const ds=t.days.filter(d=>(d.wx||d.city)===city).map(d=>d.date).sort();
    if(!ds.length)return;
    const u='https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+
      '&hourly=temperature_2m,weather_code&start_date='+ds[0]+'&end_date='+ds[ds.length-1]+'&timezone=auto';
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
    try{
      const r=await fetch(u,{signal:ctl.signal});clearTimeout(to);
      const j=await r.json();const H=j.hourly;if(!H||!H.time)return;
      ds.forEach(date=>{
        const cells=[['早','08:00'],['午','14:00'],['晚','20:00']].map(([lb,hm])=>{
          const i=H.time.indexOf(date+'T'+hm);
          return i<0?null:{lb,t:Math.round(H.temperature_2m[i]),c:H.weather_code[i]};
        }).filter(Boolean);
        if(cells.length)wx[date]={cells};
      });
    }catch(e){clearTimeout(to);}
  });
  await Promise.all(jobs);S.wxTried=true;save();render();
}
async function refreshRate(){
  const t=T();if(!t||!navigator.onLine)return;
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/EUR',{signal:ctl.signal});clearTimeout(to);
    const j=await r.json();
    if(j&&j.rates&&j.rates.CNY){t.meta.rate=Object.assign({},t.meta.rate,{EUR:j.rates.CNY,USD:j.rates.CNY/(j.rates.USD||1),JPY:j.rates.CNY/(j.rates.JPY||1),CNY:1});t.meta.rateAsOf=todayISO();save();render();}
  }catch(e){clearTimeout(to);}
}
</script>
<script>
/* ══════════ 渲染 ══════════ */
const SCROLLERS=['#scroll','.sh-b','#detail .dbody','#show .pages'];
let _keep=null;
function render(){
  const app=$('#app');
  // 重绘是把整块 innerHTML 换掉，新的滚动容器一律从 0 开始。
  // 所以画之前先记下每个容器滚到哪，画完再放回去。
  // 只有明确要回顶部的动作（切 tab、切天、进旅程）才事先把 __scrollTop 置 0。
  _keep={};SCROLLERS.forEach(q=>{const el=$(q);if(el)_keep[q]=el.scrollTop;});
  if(window.__scrollTop!=null)_keep['#scroll']=window.__scrollTop;
  window.__scrollTop=null;
  if(!DB.trips.length){app.innerHTML=gate()+sheetHTML();afterRender();return;}
  if(S.screen==='trips'){
    app.innerHTML='<div id="scroll">'+viewTrips()+'</div>'+sheetHTML();
    afterRender();return;
  }
  const t=T();
  if(!t){S.screen='trips';return render();}
  const body=S.tab==='plan'?viewPlan():(S.tab==='vou'?viewVou():viewEss());
  app.innerHTML=
    '<div id="navbar"><div class="in">'+
      '<button class="back" data-a="toTrips" aria-label="回到我的旅程">'+svg(I.back,20)+'</button>'+
    '</div></div>'+
    '<div id="scroll">'+overview(t)+stickyBar()+body+'</div>'+
    (S.open?detail():'')+(S.vshow?showScreen():'')+sheetHTML();
  afterRender();
}
function afterRender(){
  if(_keep)SCROLLERS.forEach(q=>{const el=$(q);if(el&&_keep[q]!=null)el.scrollTop=_keep[q];});
  _keep=null;
  const strip=$('.datestrip'),on=$('.dtab.on');
  if(strip&&on){strip.scrollLeft=Math.max(0,on.offsetLeft-(strip.clientWidth-on.clientWidth)/2);}
}

/* ── 导入引导 ── */
function gate(){
  return '<div id="gate">'+
    '<div class="logo">'+svg(I.pin,30)+'</div>'+
    '<h1>行程速查</h1>'+
    '<p>这个壳里没有任何数据。把行程文件导进来，内容只存在这台手机上，不上传、不同步。</p>'+
    (S.err?'<div class="err">'+h(S.err)+'</div>':'')+
    '<button class="btn" data-a="import">'+svg(I.dl,17)+' 导入行程文件</button>'+
    '<div class="note">换手机或者清了浏览器数据，重新导一次就行。文件在「设置 → 导出」里随时能生成。</div>'+
  '</div>';
}

/* ── 我的旅程 ── */
function viewTrips(){
  const list=DB.trips.slice().sort((a,b)=>(b.created||0)-(a.created||0));
  return '<div class="tlist">'+
    '<h1>我的旅程</h1>'+
    '<div class="sub">'+list.length+' 段 · 都只存在这台手机上</div>'+
    list.map(t=>{
      const m=t.meta,d=nDays(m.start,m.end);
      const img=pic(m.routeImage);
      const stk=(t.stickers||[]).slice(0,4).map(s=>'<span class="stk" style="left:'+s.x+'%;top:'+s.y+'%;transform:translate(-50%,-50%) rotate('+(s.rot||0)+'deg)">'+s.e+'</span>').join('');
      return '<div class="tcardwrap">'+
        '<button class="tcard'+(t.id===DB.cur?' on':'')+'" data-a="openTrip" data-v="'+t.id+'" data-lp="trip:'+t.id+'">'+
        '<span class="tthumb">'+(img?'<img src="'+img+'" alt="">':svg(I.pin,22))+stk+'</span>'+
        '<span class="tmeta">'+
          '<span class="t">'+h(m.title)+'</span>'+
          '<span class="d mono">'+md(m.start)+' – '+md(m.end)+(d?' · '+d+' 天':'')+'</span>'+
          '<span class="w">'+h(m.participants||m.country||'')+'</span>'+
        '</span>'+
        '<span class="tgo">'+svg(I.go,18)+'</span></button>'+

  const notes=it.notes||[];
  const sp=spendsOfItem(it.id);
  const sum=sp.reduce((s,x)=>s+toCNY(x.amount,x.cur),0);
  return '<div id="detail">'+
    '<div class="dtop"><div class="in">'+
      '<button class="back" data-a="closeItem" aria-label="返回">'+svg(I.back,18)+'</button>'+
      '<span class="t">Day '+(di+1)+' · '+mdSlash(d.date)+' '+h(d.city||'')+'</span>'+
    '</div></div>'+
    '<div class="dbody">'+
      '<div class="dhead">'+
        '<div class="l1"><span class="c-chip" style="'+chipOf(it.theme)+'">'+h(it.theme)+'</span>'+
          '<span class="when mono">'+h(it.time||'')+(end?' – '+h(end):'')+(it.dur?' · 预计 '+h(it.dur):'')+'</span></div>'+
        '<div class="pl">'+h(pName(it))+'</div>'+
        (it.note?'<div class="nt">'+h(it.note)+'</div>':'')+
        '<button class="ed" data-a="editItem" data-v="'+it.id+'">'+svg(I.pen,12)+' 编辑这一程</button>'+
      '</div>'+

      '<div class="dcard"><div class="ch"><span class="t">地点</span>'+
        '<span class="pin'+(pinned?' on':'')+'">'+(pinned?'已钉住':(it.place.trim()?'按名字搜':'没填地点'))+'</span>'+
        '<span class="r"><button data-a="sheet" data-v="omap">改定位</button></span></div>'+
        (it.addr?'<div class="addr">'+h(it.addr)+'</div>':'')+
        ((pinned||it.place.trim())
          ?'<a class="gomap" href="'+h(mapHref(it))+'" target="_blank" rel="noopener">'+svg(I.pin,15)+' '+(pinned?'在 Google 地图打开':'到 Google 地图搜这里')+'</a>'
          :'')+
        '<div class="note">'+(pinned?'这一程存了地图链接，点上面直接跳到这个位置。'
          :(it.place.trim()?('没存链接，按「'+h(mapSearchText(it))+'」搜。要钉死某个门口就点「改定位」。')
                           :'这一程没填地点，也没存地图链接。补个地点就能直接搜，或者点「改定位」粘个链接。'))+'</div>'+
      '</div>'+

      '<div class="dcard"><div class="ch"><span class="t">凭证</span>'+
        '<span class="r"><button data-a="editItem" data-v="'+it.id+'">挂凭证</button></span></div>'+
        (vs.length?vs.map(v=>{
          const im=pic((v.imgs||[])[0]);
          return '<div style="position:relative"><button class="vrow" style="margin:0" data-a="show" data-v="'+v.id+'" data-lp="dv:'+v.id+'">'+
            '<span class="vthumb">'+(im?'<img src="'+im+'" alt="">':svg(I.img,17))+'</span>'+
            '<span class="vmain"><span class="t">'+h(v.title)+'</span>'+(v.sub?'<span class="s">'+h(v.sub)+'</span>':'')+'</span>'+
            '<span class="vgo">出示</span></button>'+
            (S.menu==='dv:'+v.id?'<span class="pop"><button class="del" data-a="unhook" data-v="'+v.id+'">取消关联</button></span>':'')+'</div>';
        }).join(''):'<div class="empty" style="margin:2px 0"><b>这一程还没挂凭证</b>点右上角「挂凭证」，从已有的里挑或者现传。</div>')+
      '</div>'+

      '<div class="dcard"><div class="ch"><span class="t">注意点</span>'+
        '<span class="pin" style="margin-left:auto;background:none;color:var(--ink3)">长按可编辑或删除</span></div>'+
        (notes.length?notes.map((n,i)=>'<div class="nrow lprow" data-lp="nt:'+i+'">'+
          '<span class="d"></span><span class="tx">'+h(n.text||n)+'</span>'+
          (S.menu==='nt:'+i?pop('editNote','delNote',String(i)):'')+'</div>').join('')
          :'<div class="empty" style="margin:2px 0"><b>还没有注意点</b>排队技巧、要带的东西、小红书攻略<br>都可以记在这里</div>')+
        '<button class="dash" style="min-height:42px;font-size:12.5px" data-a="sheet" data-v="note">'+svg(I.plus,14)+' 记个注意点</button>'+
      '</div>'+

      '<div class="dcard"><div class="ch"><span class="t">花费</span><span class="v mono">'+money(sum)+'</span></div>'+
        (sp.length?sp.map(x=>'<div class="srow lprow" data-lp="sp:'+x.id+'">'+
          '<span class="d"></span><span class="t">'+h(x.item)+'</span>'+
          (x.cur!=='CNY'?'<span class="o mono">'+Number(x.amount).toLocaleString()+' '+x.cur+'</span>':'')+
          '<span class="c mono">'+money(toCNY(x.amount,x.cur))+'</span>'+
          (S.menu==='sp:'+x.id?pop('editSpend','delSpend',x.id):'')+'</div>').join('')
          :'<div class="note" style="padding:4px 0">这一程还没记花费</div>')+
        '<button class="dash" style="min-height:42px;font-size:12.5px" data-a="sheet" data-v="spend" data-x="'+it.id+'">'+svg(I.plus,14)+' 给这一程记一笔</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

/* ══════════ 一键出示 ══════════ */
function showScreen(){
  const v=vouById(S.vshow);if(!v)return'';
  const imgs=(v.imgs||[]).map(pic).filter(Boolean);
  return '<div id="show">'+
    '<div class="sh-top"><button class="back" data-a="closeShow" aria-label="返回">'+svg(I.back,20)+'</button>'+
      '<span class="t">'+h(v.title)+'</span></div>'+
    (v.code?'<div class="codebar"><div class="lb">'+h(v.codeLabel||'编号')+'</div><div class="cd mono">'+h(v.code)+'</div>'+
      (v.who?'<div class="who">'+h(v.who)+'</div>':'')+'</div>':'')+
    '<div class="pages">'+(imgs.length?imgs.map(s=>'<img src="'+s+'" alt="凭证">').join(''):
      '<div class="empty" style="margin-top:14px"><b>这份凭证没有图</b>长按凭证条可以编辑，把截图补进去。</div>')+'</div>'+
    '<div class="foot">离线也能打开 · 屏幕亮度调到最高更好扫</div>'+
  '</div>';
}

/* ══════════ sheet 外壳 ══════════ */
function wrap(title,sub,body,foot){
  return '<div class="mask" data-a="closeSheet"></div><div class="sheet" role="dialog">'+
    '<div class="sh-h"><div class="t">'+h(title)+(sub?'<em>'+h(sub)+'</em>':'')+'</div>'+
    '<button class="x" data-a="closeSheet" aria-label="关闭">'+svg(I.x,15)+'</button></div>'+
    '<div class="sh-b">'+(S.err?'<div class="err">'+h(S.err)+'</div>':'')+body+'</div>'+
    (foot?'<div class="sh-f">'+foot+'</div>':'')+'</div>';
}
function fld(label,req,inner,mini){
  return '<div class="f"><label>'+h(label)+(req===1?'<span class="req">必填</span>':(req===2?'<span class="opt">选填</span>':''))+'</label>'+inner+
    (mini?'<div class="mini">'+mini+'</div>':'')+'</div>';
}
function inp(bi,bk,v,ph,type){
  return '<input data-bi="'+bi+'" data-bk="'+bk+'" type="'+(type||'text')+'" value="'+h(v==null?'':v)+'" placeholder="'+h(ph||'')+'">';
}
function ta(bi,bk,v,ph){
  return '<textarea data-bi="'+bi+'" data-bk="'+bk+'" placeholder="'+h(ph||'')+'">'+h(v||'')+'</textarea>';
}
function curSel(bi,v){
  return '<select data-bi="'+bi+'" data-bk="cur">'+CUR.map(c=>'<option value="'+c+'"'+(c===(v||'EUR')?' selected':'')+'>'+c+' '+CURNAME[c]+'</option>').join('')+'</select>';
}
function moreBtn(label){return '<button class="morebtn" data-a="bufAdd">'+svg(I.plus,15)+' '+h(label)+'</button>';}
function saveBar(n,total,label,hint){
  const ok=n>0;
  return '<button class="btn'+(ok?'':' dim')+'" data-a="bufSave">'+h(label)+'</button>'+
    '<div class="tip">'+h(hint)+'</div>';
}
</script>
<script>
/* ══════════ 批量缓冲区 ══════════ */
function blank(kind){
  if(kind==='item')return{theme:'游玩',place:'',start:'',end:'',note:'',map:'',vou:[],sp:[{id:'p1',item:'',amount:'',cur:defCur()}]};
  if(kind==='spend')return{item:'',amount:'',cur:(T()&&T().meta.country==='意大利')?'EUR':'CNY'};
  if(kind==='note')return{text:''};
  if(kind==='vou')return{cat:'stay',title:'',sub:'',code:'',codeLabel:'确认号',who:'',note:'',addr:'',imgs:[]};
  if(kind==='place')return{cat:S.acat||'住宿',addr:'',name:'',note:'',date:''};
  if(kind==='tr')return{cat:'飞机',no:'',meta:'',name:''};
  if(kind==='pk')return{t:''};
  if(kind==='em')return{name:'',contact:'',note:'',quick:false};
  return{};
}
function bufInit(kind,rows,cat){S.buf={kind:kind,rows:rows||[blank(kind)],open:0,cat:cat||''};}
function putBuf(i,k,val){
  const r=S.buf&&S.buf.rows[i];if(!r)return;
  const m=/^sp(\d+)\.(\w+)$/.exec(k);
  if(!m){r[k]=val;return;}
  if(!r.sp||!r.sp.length)r.sp=[{id:'p1',item:'',amount:'',cur:defCur()}];
  if(r.sp[+m[1]])r.sp[+m[1]][m[2]]=val;
}
function snapBuf(){
  if(!S.buf)return;
  document.querySelectorAll('.sh-b [data-bi]').forEach(el=>putBuf(+el.dataset.bi,el.dataset.bk,el.value));
}
function okRow(kind,r){
  if(kind==='item')return!!(r.theme&&r.start);
  if(kind==='spend')return!!(r.item.trim()&&parseFloat(String(r.amount).replace(/[^\d.]/g,''))>0);
  if(kind==='note')return!!r.text.trim();
  if(kind==='vou')return!!(r.title.trim());
  if(kind==='place')return!!r.addr.trim();
  if(kind==='tr')return!!r.no.trim();
  if(kind==='pk')return!!r.t.trim();
  if(kind==='em')return!!(r.name.trim()&&r.contact.trim());
  return false;
}
function readyN(){if(!S.buf)return 0;return S.buf.rows.filter(r=>okRow(S.buf.kind,r)).length;}
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^\d.]/g,''));return n>0?n:0;};
function defCur(){const t=T();return (t&&t.meta.country==='意大利')?'EUR':'CNY';}
function spOk(q){return !!(String(q.item||'').trim()&&num(q.amount)>0);}

/* ══════════ sheet ══════════ */
function sheetHTML(){
  if(!S.sheet)return'';
  const t=T();
  switch(S.sheet){
    case 'item':return shItem();
    case 'spend':return shSpend();
    case 'note':return shNote();
    case 'vou':return shVou();
    case 'ess':return shEss();
    case 'daySpend':return shDaySpend();
    case 'tripSpend':return shTripSpend();
    case 'journal':return shJournal();
    case 'stk':return shStk();
    case 'omap':return shOmap();
    case 'settings':return shSettings();
    case 'trip':return shTrip();
  }
  return'';
}

/* 行程：一次可以加好几程 */
function shItem(){
  const t=T(),d=t.days[Math.min(S.day,t.days.length-1)];
  const edit=!!(S.arg&&S.arg.id);
  const B=S.buf.rows,body=B.map((r,i)=>{
    const ok=okRow('item',r),op=S.buf.open===i;
    const dur=durText(r.start,r.end);
    const pinned=!!(r.map||'').trim();
    const vs=(r.vou||[]).map(vouById).filter(Boolean);
    let inner='';
    if(op){
      inner='<div class="bb">'+
        fld('行程主题',1,'<div class="fchips">'+THEMES.concat(THEMES.indexOf(r.theme)<0&&r.theme?[r.theme]:[]).map(x=>'<button class="'+(r.theme===x?'on':'')+'" data-a="bufSet" data-v="'+i+'" data-k="theme" data-x="'+x+'">'+x+'</button>').join('')+'</div>')+
        '<div class="f"><div class="row2">'+
          '<div><label>开始<span class="req">必填</span></label>'+inp(i,'start',r.start,'','time')+'</div>'+
          '<div><label>结束<span class="opt">选填</span></label>'+inp(i,'end',r.end,'','time')+'</div>'+
        '</div><div class="mini" data-durhint="'+i+'">'+(dur?'预计耗时 '+h(dur)+'，会自动算':'填完起止时间会自动算耗时')+'</div></div>'+
        fld('一句话介绍',2,inp(i,'note',r.note,'选填'))+
        fld('涉及地点',2,inp(i,'place',r.place,'景点 / 餐厅 / A → B'))+
        fld('地图定位',2,inp(i,'map',r.map,'粘贴 Google 地图链接'),
          pinned?'<span style="color:var(--mint-deep)">已钉住，详情页点「在 Google 地图打开」直接跳这个位置</span>'
                :(r.place.trim()?('留空也行 —— 详情页会按「'+h(r.place.trim().slice(0,16)+(r.place.length>16?'…':'')+' '+(t.meta.country||''))+'」到 Google 地图里搜'):'地点和链接都空着的话，详情页就没有地图入口'))+
        '<div class="f"><label>'+svg(I.ticket,12)+' 凭证<span class="opt">选填</span></label>'+
          vs.map(v=>'<div class="vtag"><span class="cp">'+h(VCAT[v.cat]||'其他')+'</span>'+
            '<span class="g"><span class="t">'+h(v.title)+'</span>'+(v.sub?'<span class="s">'+h(v.sub)+'</span>':'')+'</span>'+
            '<button class="rm" data-a="vouDrop" data-v="'+i+'" data-x="'+v.id+'" aria-label="取消关联">'+svg(I.x,12)+'</button></div>').join('')+
          '<div class="btnrow"><button class="btn ghost" style="min-height:40px;font-size:12.5px" data-a="vouPick" data-v="'+i+'">'+
            (S.pick===String(i)?'收起凭证列表':((r.vou||[]).length?'再挑一张（已挂 '+r.vou.length+'）':'从已有的挑一张'))+'</button>'+
            '<button class="btn grey" style="min-height:40px;font-size:12.5px;flex:0 0 auto;width:auto;padding:0 14px" data-a="vouNew" data-v="'+i+'">'+svg(I.up,13)+' 传新的</button></div>'+
          (S.pick===String(i)?'<div class="vpick">'+(t.vouchers||[]).map(v=>{
            const on=(r.vou||[]).indexOf(v.id)>=0;
            return '<button class="it'+(on?' on':'')+'" data-a="vouTog" data-v="'+i+'" data-x="'+v.id+'">'+
              '<span class="bx">'+(on?svg(I.check,10):'')+'</span><span class="cp">'+h(VCAT[v.cat]||'其他')+'</span>'+
              '<span class="g"><span class="t">'+h(v.title)+'</span>'+(v.sub?'<span class="s">'+h(v.sub)+'</span>':'')+'</span></button>';
          }).join('')+'</div>':'')+
        '</div>'+
        (function(){
          const sp=(r.sp&&r.sp.length)?r.sp:[{id:'p1',item:'',amount:'',cur:defCur()}];
          let sum=0,n=0;sp.forEach(q=>{if(spOk(q)){n++;sum+=toCNY(num(q.amount),q.cur);}});
          return '<div class="f"><label>'+svg(I.card,12)+' 这一程花了多少<span class="opt">选填</span></label>'+
            sp.map((q,j)=>'<div class="sprow">'+
              '<input data-bi="'+i+'" data-bk="sp'+j+'.item" type="text" value="'+h(q.item)+'" placeholder="'+(j===0?'事项，比如 门票 2 张':'再记一笔')+'">'+
              '<input data-bi="'+i+'" data-bk="sp'+j+'.amount" type="text" inputmode="decimal" value="'+h(q.amount)+'" placeholder="0.00">'+
              '<select data-bi="'+i+'" data-bk="sp'+j+'.cur">'+CUR.map(c=>'<option value="'+c+'"'+(c===q.cur?' selected':'')+'>'+CURNAME[c]+'</option>').join('')+'</select>'+
              (sp.length>1?'<button class="rm" data-a="spDrop" data-v="'+i+'" data-x="'+j+'" aria-label="删掉这一笔">'+svg(I.x,12)+'</button>':'')+
            '</div>').join('')+
            '<div class="sprow" style="margin-bottom:0">'+
              '<button class="spadd" data-a="spAdd" data-v="'+i+'">'+svg(I.plus,12)+' 再记一笔</button>'+
              '<span class="spsum'+(n?' ok':'')+'">'+(n?('≈ '+money(sum)):'不花钱就空着')+'</span>'+
            '</div></div>';
        })()+
      '</div>';
    }
    return '<div class="blk'+(op?' on':'')+(ok?' ok':(op?'':' bad'))+'">'+
      '<div class="bh"><span class="num">'+(i+1)+'</span>'+
        (op?'<button class="sum" data-a="bufFold"><span class="st">正在填 '+svg(I.down,13)+'</span></button>'
           :'<button class="sum" data-a="bufOpen" data-v="'+i+'"><span class="cp" style="'+chipOf(r.theme)+'">'+h(r.theme)+'</span>'+
             '<span class="wh mono">'+(r.start?(h(r.start)+(r.end?'–'+h(r.end):'')):'缺时间')+'</span>'+
             '<span class="pl">'+h(r.place.trim()||r.theme)+'</span></button>')+
        (B.length>1?'<button class="rm" data-a="bufDrop" data-v="'+i+'" aria-label="删掉这一程">'+svg(I.x,14)+'</button>':'')+
      '</div>'+inner+'</div>';
  }).join('');
  const n=readyN();
  return wrap(edit?'编辑行程':('Day '+(t.days.indexOf(d)+1)+' 添加行程'),edit?'':mdSlash(d.date)+' '+(d.city||''),
    body+(edit?'':moreBtn('再加一程')),
    saveBar(n,B.length,edit?'保存修改':(n>1?('保存 '+n+' 程'):'添加到时间轴'),
      n>0?(B.length-n>0?('还有 '+(B.length-n)+' 程没填完，这次先不存'):'都填好了'):'主题和开始时间填了就能排进时间轴'));
}

/* 记一笔 */
function shSpend(){
  const t=T(),B=S.buf.rows;
  const scope=S.arg&&S.arg.itemId?findItem(S.arg.itemId):null;
  const edit=!!(S.arg&&S.arg.id);
  let sum=0,n=0;
  B.forEach(r=>{if(okRow('spend',r)){n++;sum+=toCNY(num(r.amount),r.cur);}});
  const body=B.map((r,i)=>{
    const ok=okRow('spend',r);
    return '<div class="rowline'+(ok?' ok':' bad')+'"><span class="num">'+(i+1)+'</span>'+
      '<span class="g">'+inp(i,'item',r.item,'花在什么上')+
      '<span style="display:flex;gap:6px">'+
        '<span style="flex:0 0 116px">'+inp(i,'amount',r.amount,'0.00')+'</span>'+
        '<span style="flex:1;min-width:0">'+curSel(i,r.cur)+'</span></span>'+
      '<span class="cny'+(ok?' ok':'')+'">'+(ok?'≈ '+money(toCNY(num(r.amount),r.cur)):'填了金额这里出人民币')+'</span></span>'+
      (B.length>1?'<button class="rm" data-a="bufDrop" data-v="'+i+'" aria-label="删掉这一笔">'+svg(I.x,13)+'</button>':'')+
    '</div>';
  }).join('');
  const title=edit?'改这一笔':(scope?(pName(scope)+' 记一笔'):('Day '+(Math.min(S.day,t.days.length-1)+1)+' 记一笔'));
  return wrap(title,scope?'记在这一程上':'',body+(edit?'':moreBtn('再记一笔'))+
    '<div class="hint" id="sumline">'+(n?('这次一共 '+money(sum)):'填了金额这里出合计')+'</div>',
    saveBar(n,B.length,edit?'保存修改':(n>1?('保存 '+n+' 笔'):'保存'),
      n>0?(B.length-n>0?('还有 '+(B.length-n)+' 笔没填完，这次先不存'):'汇率按 1 '+(B[0].cur||'EUR')+' ≈ '+rate(B[0].cur||'EUR').toFixed(3)+' 元算'):'名目和金额都填了才存得住'));
}

/* 注意点 */
function shNote(){
  const B=S.buf.rows,edit=!!(S.arg&&S.arg.idx>=0);
  const body=B.map((r,i)=>{
    const ok=okRow('note',r);
    return '<div class="rowline'+(ok?' ok':' bad')+'"><span class="num">'+(i+1)+'</span>'+
      '<span class="g">'+inp(i,'text',r.text,'比如 大件行李门口能免费寄存')+'</span>'+
      (B.length>1?'<button class="rm" data-a="bufDrop" data-v="'+i+'" aria-label="删掉">'+svg(I.x,13)+'</button>':'')+'</div>';
  }).join('');
  const n=readyN();
  return wrap(edit?'改这条注意点':'记个注意点','',body+(edit?'':moreBtn('再记一条')),
    saveBar(n,B.length,edit?'保存修改':(n>1?('保存 '+n+' 条'):'保存'),
      n>0?(B.length-n>0?('还有 '+(B.length-n)+' 条空着，这次先不存'):''):'至少写一条才存得住'));
}

/* 凭证 */
function shVou(){
  const B=S.buf.rows,edit=!!(S.arg&&S.arg.id);
  const CATS=[['stay','住宿'],['move','交通'],['see','游览'],['other','其他']];
  const body=B.map((r,i)=>{
    const ok=okRow('vou',r),op=S.buf.open===i;
    let inner='';
    if(op){
      inner='<div class="bb">'+
        fld('类目',1,'<div class="fchips">'+CATS.map(([k,l])=>'<button class="'+(r.cat===k?'on':'')+'" data-a="bufSet" data-v="'+i+'" data-k="cat" data-x="'+k+'">'+l+'</button>').join('')+'</div>')+
        fld('凭证名称',1,inp(i,'title',r.title,'酒店名 / 航班号 / 门票名'))+
        fld('一句话说明',2,inp(i,'sub',r.sub,'日期、房型、张数这些'))+
        '<div class="f"><div class="row2">'+

            (pic(k)?'<img src="'+pic(k)+'" style="width:100%;height:100%;object-fit:cover">':svg(I.img,16))+
            '<button data-a="imgDrop" data-v="'+i+'" data-x="'+j+'" style="position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center" aria-label="删图">'+svg(I.x,9)+'</button></span>').join('')+
          '</div>'+

          '<div class="mini">图片可以一次选好几个。PDF 请先在手机上截图再传 —— 存成图片离线出示更快，过闸机也不用等加载。</div></div>'+
      '</div>';
    }
    return '<div class="blk'+(op?' on':'')+(ok?' ok':(op?'':' bad'))+'">'+
      '<div class="bh"><span class="num">'+(i+1)+'</span>'+
        (op?'<button class="sum" data-a="bufFold"><span class="st">正在填 '+svg(I.down,13)+'</span></button>'
           :'<button class="sum" data-a="bufOpen" data-v="'+i+'"><span class="cp">'+h(VCAT[r.cat])+'</span>'+

<script>
/* 当天花费明细 */
function shDaySpend(){
  const t=T(),d=t.days[Math.min(S.day,t.days.length-1)];
  const items=d.items.slice().sort((a,b)=>mins(a.time)-mins(b.time));
  let body='',cnt=0;
  items.forEach(it=>{
    const sp=spendsOfItem(it.id);if(!sp.length)return;cnt+=sp.length;
    const sum=sp.reduce((s,x)=>s+toCNY(x.amount,x.cur),0);
    body+='<div class="dsgrp"><div class="gh"><span class="cp" style="'+chipOf(it.theme)+'">'+h(it.theme)+'</span>'+
      '<span class="t">'+h(it.time||'')+' '+h(pName(it))+'</span><span class="v mono">'+money(sum)+'</span></div>'+
      sp.map(x=>spLine(x)).join('')+'</div>';
  });
  const loose=looseOfDate(d.date);
  if(loose.length){
    cnt+=loose.length;
    const sum=loose.reduce((s,x)=>s+toCNY(x.amount,x.cur),0);
    body+='<div class="dsgrp"><div class="gh"><span class="cp" style="background:var(--mint-tint);color:var(--mint-deep)">散记</span>'+
      '<span class="t">没挂在具体行程上</span><span class="v mono">'+money(sum)+'</span></div>'+
      loose.map(x=>spLine(x)).join('')+'</div>';
  }
  if(!cnt)body='<div class="empty"><b>这天还没有花费</b>门票、吃饭、交通，随手记一笔就行。</div>';
  return wrap('Day '+(t.days.indexOf(d)+1)+' 花费明细',cnt?'长按任意一笔可以改或删':'还没记过',body,
    '<div class="stot"><span class="g"><span class="l">Day '+(t.days.indexOf(d)+1)+' 合计</span>'+
    '<span class="v mono">'+money(spentOn(d.date))+'</span></span>'+
    '<button class="btn" data-a="sheet" data-v="spend">'+svg(I.plus,14)+' 记一笔</button></div>');
}
function spLine(x){
  return '<div class="srow lprow" data-lp="sp:'+x.id+'"><span class="d"></span>'+
    '<span class="t">'+h(x.item)+'</span>'+
    (x.cur!=='CNY'?'<span class="o mono">'+Number(x.amount).toLocaleString()+' '+x.cur+'</span>':'')+
    '<span class="c mono">'+money(toCNY(x.amount,x.cur))+'</span>'+

    '<div class="btnrow"><button class="btn grey" style="flex:0 0 96px" data-a="mapClear">清空</button>'+
    '<button class="btn" data-a="mapSave">保存</button></div>');
}
/* 新建 / 编辑旅程 */
function shTrip(){

    fld('参与者',2,inp(0,'participants',r.participants,'和谁一起'))+

    '<button class="btn" data-a="tripSave">'+(edit?'保存修改':'建好，开始排行程')+'</button>'+
    '<div class="tip">新建的旅程是空的，行程、凭证、速查都从里面自己加。</div>');

/* 设置 */
function shSettings(){
  const one=DB.trips.map(t=>{
    const n=(t.vouchers||[]).reduce((s,v)=>s+(v.imgs||[]).length,0);
    return '<div class="setrow"><span class="g"><span class="t">'+h(t.meta.title)+'</span>'+

      '<button class="a" data-a="export" data-v="'+t.id+'">导出</button></div>';

  return wrap('设置','行程只存在这台手机上',
    '<div class="sec-h" style="margin-left:0"><span class="t">按旅程导出</span><span class="n">一段一个文件</span></div>'+

    '<div class="hint">一段一个文件，单独发给同行的人也方便。凭证图都在文件里，所以带图的那段会大一些。「全部导出」是兜底，换手机时导一个文件就全回来了。</div>'+

    '<div class="hint">同一段旅程再导一次会覆盖本机这一份。</div>'+

    (daysSinceExport()>=99?'<br><b style="color:#B8710F">还没导出过，出门前记得导一份。</b>':(daysSinceExport()>=5?'<br><b style="color:#B8710F">上次导出已经是 '+daysSinceExport()+' 天前了。</b>':''))+'</div>','');

<script>
/* ══════════ 事件 ══════════ */
let lpT=0,lpFired=false,lpX=0,lpY=0;
// iOS 上长按容易被系统的文字选择/预览抢走，所以：
// · CSS 里给可长按的元素关掉 -webkit-touch-callout 和 user-select
// · 这里屏蔽 contextmenu
// · 取消条件只看手指移动距离，不看 scroll —— 橡皮筋回弹也会发 scroll，会把长按误杀
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-lp],[data-stkgrab]'))e.preventDefault();});
document.addEventListener('pointerdown',e=>{
  lpFired=false;clearTimeout(lpT);
  lpX=e.clientX;lpY=e.clientY;
  const g=e.target.closest('[data-stkgrab],[data-stksize]');
  if(g){stkDown(e,g);return;}
  const lp=e.target.closest('[data-lp]');
  if(!lp)return;
  if(e.target.closest('input,textarea,select,a'))return;
  const key=lp.dataset.lp;
  lpT=setTimeout(()=>{
    lpFired=true;if(navigator.vibrate)try{navigator.vibrate(12);}catch(_){}
    if(key==='ovhead'){ACT('editTrip',DB.cur);return;}
    snapBuf();setS({menu:S.menu===key?'':key});
  },450);
},true);
document.addEventListener('pointermove',e=>{
  if(!lpT)return;
  if(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10){clearTimeout(lpT);lpT=0;}
},true);
document.addEventListener('pointerup',()=>{clearTimeout(lpT);lpT=0;},true);
document.addEventListener('pointercancel',()=>{clearTimeout(lpT);lpT=0;},true);

document.addEventListener('click',e=>{
  if(lpFired){lpFired=false;e.preventDefault();e.stopPropagation();return;}
  if(S.menu&&!e.target.closest('.pop')&&!e.target.closest('[data-lp]')){snapBuf();setS({menu:''});return;}
  if(S.stk&&!e.target.closest('.stkbox')&&!e.target.closest('.stkadd')){setS({stk:''});return;}
  const b=e.target.closest('[data-a]');
  if(!b)return;
  if(b.tagName==='A')return;
  e.preventDefault();
  ACT(b.dataset.a,b.dataset.v,b.dataset.k,b.dataset.x,b);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-bi]');
  if(!el||!S.buf)return;
  const i=+el.dataset.bi,k=el.dataset.bk;
  putBuf(i,k,el.value);
  if(S.sheet==='item'&&/^sp\d+\./.test(k)){
    const r=S.buf.rows[i];let sum=0,n=0;
    (r.sp||[]).forEach(q=>{if(spOk(q)){n++;sum+=toCNY(num(q.amount),q.cur);}});
    const el2=document.querySelector('.sh-b .spsum');
    if(el2){el2.textContent=n?('≈ '+money(sum)):'不花钱就空着';el2.className='spsum'+(n?' ok':'');}
  }
  if(S.sheet==='spend'){
    let sum=0,n=0;S.buf.rows.forEach(r=>{if(okRow('spend',r)){n++;sum+=toCNY(num(r.amount),r.cur);}});
    const l=$('#sumline');if(l)l.textContent=n?('这次一共 '+money(sum)):'填了金额这里出合计';
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-bi]');
  if(!el||!S.buf)return;
  const i=+el.dataset.bi,k=el.dataset.bk;
  putBuf(i,k,el.value);
  // 改时间不能重画：iOS 上时间选择器还开着，一重画就被关掉、值也没了
  if(S.sheet==='item'&&(k==='start'||k==='end')){
    const r=S.buf.rows[i],d=durText(r.start,r.end);
    const hint=document.querySelector('[data-durhint="'+i+'"]');

let stkA=null;
function stkDown(e,g){
  const id=g.dataset.stkgrab||g.dataset.stksize;
  const box=g.closest('.stkbox'),ov=$('#ov');
  if(!box||!ov)return;
  if(g.dataset.stksize){
    if(S.stk!==id)return;
    stkA={id,box,ov,mode:'size'};e.preventDefault();
    try{g.setPointerCapture(e.pointerId);}catch(_){}
    return;
  }
  if(S.stk===id){ // 已激活，直接拖
    stkA={id,box,ov,mode:'move'};e.preventDefault();
    try{g.setPointerCapture(e.pointerId);}catch(_){}
    return;
  }
  clearTimeout(lpT);
  lpT=setTimeout(()=>{
    lpFired=true;if(navigator.vibrate)try{navigator.vibrate(12);}catch(_){}
    S.stk=id;box.classList.add('live');
    document.querySelectorAll('.stkbox').forEach(b=>{if(b!==box)b.classList.remove('live');});
    const pad=document.querySelector('.stkpad');if(pad)pad.style.pointerEvents='auto';
    stkA={id,box,ov,mode:'move'};
    try{g.setPointerCapture(e.pointerId);}catch(_){}

}
document.addEventListener('pointermove',e=>{
  if(!stkA)return;
  e.preventDefault();
  const r=stkA.ov.getBoundingClientRect();
  if(stkA.mode==='move'){
    const x=Math.min(93,Math.max(7,(e.clientX-r.left)/r.width*100));
    const y=Math.min(84,Math.max(16,(e.clientY-r.top)/r.height*100));
    stkA.box.style.left=x+'%';stkA.box.style.top=y+'%';stkA.px=x;stkA.py=y;
  }else{
    const cx=r.left+(parseFloat(stkA.box.style.left)/100)*r.width;
    const cy=r.top+(parseFloat(stkA.box.style.top)/100)*r.height;
    const sz=Math.max(MIN_SZ,Math.min(MAX_SZ,Math.max(Math.abs(e.clientX-cx),Math.abs(e.clientY-cy))*2-14));
    stkA.sz=sz;paintStk(stkA.box,sz);
  }
},{passive:false});
function paintStk(box,sz){
  const fr=sz+14,hf=fr/2;
  const f=box.querySelector('.frame'),em=box.querySelector('.emo'),hx=box.querySelector('.hx'),hz=box.querySelector('.hz');
  f.style.left=(-hf)+'px';f.style.top=(-hf)+'px';f.style.width=fr+'px';f.style.height=fr+'px';
  em.style.width=(sz+16)+'px';em.style.height=(sz+16)+'px';em.style.fontSize=sz+'px';
  hx.style.left=hf+'px';hx.style.top=(-hf)+'px';
  hz.style.left=hf+'px';hz.style.top=hf+'px';
}
document.addEventListener('pointerup',()=>{
  if(!stkA)return;
  const t=T(),s=(t.stickers||[]).find(x=>x.id===stkA.id);
  if(s){
    if(stkA.mode==='move'&&stkA.px!=null){s.x=Math.round(stkA.px*10)/10;s.y=Math.round(stkA.py*10)/10;}
    if(stkA.mode==='size'&&stkA.sz!=null)s.size=Math.round(stkA.sz);

});
