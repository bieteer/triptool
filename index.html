      c.items.push({id:id||uid('k'),t:text,done:false});
    };
    const cat=S.buf.cat||(t.packing[0]||{}).cat||'其他';
    if(edit){
      let old=null,oc=null,oj=-1;
      t.packing.forEach(c=>{const j=c.items.findIndex(z=>z.id===S.arg.id);if(j>=0){old=c.items[j];oc=c;oj=j;}});
      if(old&&oc&&oc.cat===cat){old.t=rows[0].t.trim();}       // 原地改，不动位置也不丢勾
      else if(old){oc.items.splice(oj,1);
        let c2=t.packing.find(z=>z.cat===cat);
        if(!c2){c2={cat:cat,items:[]};t.packing.push(c2);}
        c2.items.push({id:old.id,t:rows[0].t.trim(),done:old.done});}
    }
    else rows.forEach(r=>put(cat,r.t.trim()));
  }
  else if(kind==='em'){
    const E=t.essentials;E.emergency=E.emergency||[];
    if(edit){const p=E.emergency.find(z=>z.id===S.arg.id),r=rows[0];
      Object.assign(p,{name:r.name.trim(),contact:r.contact.trim(),note:r.note.trim(),quick:!!r.quick});}
    else rows.forEach(r=>E.emergency.push({id:uid('e'),name:r.name.trim(),contact:r.contact.trim(),note:r.note.trim(),quick:!!r.quick}));
  }
  save();
  const skipped=S.buf.rows.length-rows.length;
  setS({sheet:'',buf:null,arg:null,err:'',pick:''});
  toast(skipped?('存了 '+rows.length+' 条，跳过 '+skipped+' 条没填完的'):('存好了'));
}

/* ══════════ 新建 / 改期 ══════════ */
function newTrip(r){
  const days=[];
  let d=new Date(r.start+'T12:00:00'),end=new Date(r.end+'T12:00:00');
  while(d<=end&&days.length<90){
    days.push({date:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),city:'',wx:'',items:[]});
    d=new Date(d.getTime()+864e5);
  }
  return {id:uid('t'),created:Date.now(),
    meta:{title:r.title.trim(),country:r.country.trim(),start:r.start,end:r.end,
      participants:r.participants.trim(),cities:[],routeImage:'',sos:[],
      rate:{CNY:1,EUR:7.7,USD:7.1,JPY:0.048},rateAsOf:'',spots:{}},
    days:days,vouchers:[],spends:[],
    essentials:{places:[],transport:[],emergency:[]},
    packing:[{cat:'证件',items:[]},{cat:'电子设备',items:[]},{cat:'洗漱用品',items:[]},{cat:'药品',items:[]},{cat:'其他',items:[]}],
    journal:{},stickers:[],weather:{}};
}
function reDays(t){
  const keep={};t.days.forEach(d=>keep[d.date]=d);
  const out=[];let d=new Date(t.meta.start+'T12:00:00'),end=new Date(t.meta.end+'T12:00:00');
  while(d<=end&&out.length<90){
    const iso=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    out.push(keep[iso]||{date:iso,city:'',wx:'',items:[]});
    d=new Date(d.getTime()+864e5);
  }
  // 掉在范围外的行程不能丢，塞回第一天
  t.days.forEach(old=>{if(!out.some(z=>z.date===old.date)&&old.items.length)out[0].items=out[0].items.concat(old.items);});
  t.days=out;
}

/* ══════════ 选图 ══════════ */
function shrink(file,max,q){
  return new Promise(res=>{
    if(file.type==='application/pdf'){res('');return;}
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const s=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q||0.78));
      };
      im.onerror=()=>res('');
      im.src=fr.result;
    };
    fr.onerror=()=>res('');
    fr.readAsDataURL(file);
  });
}
let imgCB=null,imgMax=9;
function pickImgs(cb,max){imgCB=cb;imgMax=max||9;$('#pickimg').click();}
$('#pickimg').addEventListener('change',async e=>{
  const files=[...e.target.files].slice(0,imgMax);e.target.value='';
  if(!files.length)return;
  toast('处理图片中…');
  const keys=[];
  for(const f of files){
    const url=await shrink(f,1500,0.78);
    if(!url){toast('PDF 请先截图再传');continue;}
    const k=uid('g');IMGS[k]=url;keys.push(k);
  }
  await saveImgs();
  if(imgCB)imgCB(keys);
});

/* ══════════ 导入 / 导出 ══════════ */
function fixThemes(t){
  // 「住宿」「办事」这两类后来取消了，老文件里还有；统一归到「其他」
  let n=0;
  (t.days||[]).forEach(d=>(d.items||[]).forEach(it=>{
    if(it.theme&&THEMES.indexOf(it.theme)<0){it.theme='其他';n++;}
  }));
  return n;
}
function normEss(E,sos){
  const o=Object.assign({places:[],transport:[],emergency:[]},E||{});
  // 老格式：快拨号码单独放在 trip.sos 里；合并成一份带 quick 的列表
  if(o.emergency.length&&!o.emergency.some(x=>'quick' in x)){
    const pre=(sos||[]).map(x=>({id:uid('e'),name:x.l,contact:x.n,note:'',quick:true}));
    o.emergency=pre.concat(o.emergency.map(x=>Object.assign({quick:false},x)));
  }
  return o;
}
function normalize(f){
  const m=f.trip||{};
  return {id:m.id||uid('t'),created:m.created||Date.now(),
    meta:{title:m.title||'未命名旅程',country:m.country||'',start:m.start||'',end:m.end||'',
      participants:m.participants||'',cities:m.cities||[],routeImage:m.routeImage||'',sos:m.sos||[],
      rate:m.rate||{CNY:1},rateAsOf:m.rateAsOf||'',spots:m.spots||{}},
    days:(f.days||[]).map(d=>Object.assign({items:[]},d)),
    vouchers:f.vouchers||[],spends:f.spends||[],
    essentials:normEss(f.essentials,(f.trip||{}).sos),
    packing:f.packing||[],journal:f.journal||{},stickers:f.stickers||[],weather:f.weather||{},
    lastExport:f.lastExport||''};
}
function normalizeFixed(f){const t=normalize(f);fixThemes(t);return t;}
function denormalize(t){
  const imgs={};
  const grab=k=>{if(k&&IMGS[k])imgs[k]=IMGS[k];};
  grab(t.meta.routeImage);
  (t.vouchers||[]).forEach(v=>(v.imgs||[]).forEach(grab));
  return {format:'trip-quickref/v2',version:2,savedAt:new Date().toISOString(),
    trip:Object.assign({id:t.id,created:t.created},t.meta),
    days:t.days,vouchers:t.vouchers,spends:t.spends,essentials:t.essentials,
    packing:t.packing,journal:t.journal,stickers:t.stickers,images:imgs};
}
async function dl(name,obj){
  const txt=JSON.stringify(obj);
  // iPhone 上 <a download> 常常只是打开一个新页面，能用系统分享就走分享
  try{
    if(navigator.canShare){
      const f=new File([txt],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true;}
    }
  }catch(e){if(e&&e.name==='AbortError')return false;}
  const b=new Blob([txt],{type:'application/json'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
  return true;
}
async function doExport(id){
  const stamp=todayISO().replace(/-/g,'');
  toast('正在打包…');
  let ok=false;
  if(id){
    const t=DB.trips.find(z=>z.id===id);if(!t)return;
    ok=await dl('行程-'+t.meta.title+'-'+stamp+'.json',denormalize(t));
    if(ok){t.lastExport=new Date().toISOString();save();}
  }else{
    const imgs={};DB.trips.forEach(t=>{Object.assign(imgs,denormalize(t).images);});
    ok=await dl('行程全部-'+stamp+'.json',{format:'trip-quickref/all',version:2,savedAt:new Date().toISOString(),
      trips:DB.trips.map(t=>{const o=denormalize(t);delete o.images;return o;}),images:imgs});
    if(ok)DB.trips.forEach(t=>t.lastExport=new Date().toISOString()),save();
  }
  if(ok)toast('导好了 —— 存到网盘或者发给自己，换手机时导回来');
  render();
}
$('#pick').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const fr=new FileReader();
  fr.onload=async()=>{
    let j;try{j=JSON.parse(fr.result);}catch(err){return setS({err:'这个文件不是行程数据（JSON 解析失败）'});}
    const fmt=String(j.format||'');
    let list=[];
    if(fmt==='trip-quickref/all'&&Array.isArray(j.trips))list=j.trips;
    else if(fmt.indexOf('trip-quickref')===0)list=[j];
    else return setS({err:'这个文件不是行程速查导出的数据'});
    Object.assign(IMGS,j.images||{});
    list.forEach(one=>{Object.assign(IMGS,one.images||{});
      const nt=normalizeFixed(one);
      const i=DB.trips.findIndex(z=>z.id===nt.id);
      if(i>=0)DB.trips[i]=nt;else DB.trips.push(nt);});
    if(!DB.cur||!DB.trips.some(z=>z.id===DB.cur))DB.cur=DB.trips[0].id;
    save();await saveImgs();
    setS({sheet:'',err:'',screen:DB.trips.length>1?'trips':'trip',tab:'plan',day:defaultDay(DB.cur)});
    toast('导入好了：'+list.length+' 段旅程');
    refreshWeather();refreshRate();
  };
  fr.onerror=()=>setS({err:'文件读不出来，换一个试试'});
  fr.readAsText(f);
});

/* ══════════ 启动 ══════════ */
(async function boot(){
  try{const raw=localStorage.getItem(LS);if(raw)DB=JSON.parse(raw);}catch(e){}
  if(!DB||!Array.isArray(DB.trips))DB={trips:[],cur:''};
  // 已经存在手机里的老数据也顺手迁一下
  let fixed=0;DB.trips.forEach(t=>{fixed+=fixThemes(t);});
  if(fixed)save();
  const old=localStorage.getItem('trip-quickref-v1');
  if(old&&!DB.trips.length){try{const j=JSON.parse(old);if(j&&j.trip){DB.trips=[normalizeFixed(j)];DB.cur=DB.trips[0].id;save();}}catch(e){}}
  IMGS=(await idbGet('images'))||{};
  if(DB.trips.length&&DB.cur){S.screen=DB.trips.length>1?'trips':'trip';S.day=defaultDay(DB.cur);}
  render();
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('./sw.js');}catch(e){}}
  if(DB.cur){refreshWeather();refreshRate();}
  window.addEventListener('online',()=>{refreshWeather();refreshRate();});
})();
</script>
